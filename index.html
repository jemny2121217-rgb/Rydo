<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Battle Royale Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #000;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="crosshair"></div>
    <div id="hud">
        Health: <span id="health">100</span> | Ammo: <span id="ammo">30</span>
    </div>
    <div id="instructions">
        Click to Play<br>(W,A,S,D to move, Mouse to look, Click to shoot)
    </div>

    <script>
        // Game Engine Variables
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        // Game State Variables
        let health = 100;
        let ammo = 30;
        let targets = [];
        let zone;
        let zoneRadius = 100;

        const instructions = document.getElementById('instructions');
        const healthUI = document.getElementById('health');
        const ammoUI = document.getElementById('ammo');

        init();
        animate();

        function init() {
            // 1. Scene & Camera Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6;

            // 2. Lighting
            const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
            light.position.set(0, 200, 0);
            scene.add(light);

            // 3. Ground Terrain
            const floorGeometry = new THREE.PlaneGeometry(300, 300);
            const floorMaterial = new THREE.MeshBasicMaterial({ color: 0x228b22 });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 4. Safe Zone Cylinder
            const zoneGeometry = new THREE.CylinderGeometry(zoneRadius, zoneRadius, 50, 32, 1, true);
            const zoneMaterial = new THREE.MeshBasicMaterial({ color: 0x0000ff, side: THREE.DoubleSide, transparent: true, opacity: 0.3 });
            zone = new THREE.Mesh(zoneGeometry, zoneMaterial);
            zone.position.y = 25;
            scene.add(zone);

            // 5. Enemy Targets Setup
            for (let i = 0; i < 10; i++) {
                const targetGeo = new THREE.BoxGeometry(1, 2, 1);
                const targetMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const target = new THREE.Mesh(targetGeo, targetMat);
                target.position.set((Math.random() - 0.5) * 80, 1, (Math.random() - 0.5) * 80);
                scene.add(target);
                targets.push(target);
            }

            // 6. Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 7. Input Event Listeners
            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    instructions.style.display = 'none';
                } else {
                    instructions.style.display = 'block';
                }
            });

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', shoot);
            window.addEventListener('resize', onWindowResize);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onMouseMove(event) {
            if (document.pointerLockElement === document.body) {
                camera.rotation.y -= event.movementX * 0.002;
            }
        }

        function shoot() {
            if (document.pointerLockElement !== document.body || ammo <= 0) return;

            ammo--;
            ammoUI.innerText = ammo;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(targets);
            if (intersects.length > 0) {
                const hitObject = intersects[0].object;
                scene.remove(hitObject);
                targets = targets.filter(t => t !== hitObject);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (document.pointerLockElement === document.body) {
                // Movement damping
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

                camera.translateX(-velocity.x * delta);
                camera.translateZ(velocity.z * delta);
                camera.position.y = 1.6; // Lock vertical height

                // Zone Shrink Mechanic
                if (zoneRadius > 5) {
                    zoneRadius -= delta * 0.5;
                    zone.scale.set(zoneRadius / 100, 1, zoneRadius / 100);
                }

                // Check Zone Damage
                const distanceFromCenter = Math.sqrt(camera.position.x ** 2 + camera.position.z ** 2);
                if (distanceFromCenter > zoneRadius) {
                    health = Math.max(0, health - delta * 5);
                    healthUI.innerText = Math.floor(health);
                }
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
