<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rydo — Move your way.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0d;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:480px;margin:auto;padding:22px 16px;min-height:100vh}
.logo{font-size:38px;font-weight:800;margin:12px 0 4px}.tag{color:#999;margin-bottom:25px}
.card{background:#15171c;border:1px solid #292c33;border-radius:22px;padding:20px;margin-bottom:16px}
h2{margin:0 0 18px;font-size:25px}label{display:block;color:#aaa;font-size:13px;margin:12px 0 6px}
input,select{width:100%;padding:15px;border-radius:13px;border:1px solid #343740;background:#0d0f13;color:#fff;font-size:15px}
button{width:100%;padding:15px;border:0;border-radius:13px;background:#fff;color:#111;font-weight:700;font-size:15px;margin-top:12px}
button:active{transform:scale(.98)}.ghost{background:#24272e;color:#fff}.danger{background:#d93636;color:#fff}
.link{background:none;color:#fff;padding:4px;margin-top:10px;text-decoration:underline}
.msg{margin-top:13px;padding:12px;border-radius:12px;background:#22252b;color:#ddd;font-size:14px}
.hidden{display:none}.vehicles{display:flex;gap:8px}.vehicles button{background:#24272e;color:#fff;margin-top:0}
.vehicles .on{background:#fff;color:#111}.fare{font-size:28px;font-weight:800;margin:8px 0}
.status{padding:14px;border-radius:14px;background:#20232a;margin-top:15px}
.small{color:#999;font-size:13px;line-height:1.5}
</style>
</head>

<body>
<div class="wrap">

<div class="logo">Rydo</div>
<div class="tag">Move your way.</div>

<!-- AUTH -->
<section id="auth" class="card">
<h2 id="authTitle">Create account</h2>

<div id="registerBox">
<label>Full name</label>
<input id="name" placeholder="Your name">

<label>Phone</label>
<input id="phone" placeholder="98XXXXXXXX" type="tel">

<label>Email</label>
<input id="email" placeholder="you@email.com" type="email">

<label>Password</label>
<input id="password" type="password" placeholder="Minimum 6 characters">

<button onclick="register()">REGISTER</button>
<button class="ghost" onclick="showLogin()">Already have an account? LOGIN</button>
</div>

<div id="loginBox" class="hidden">
<label>Email</label>
<input id="loginEmail" type="email" placeholder="you@email.com">

<label>Password</label>
<input id="loginPassword" type="password" placeholder="Password">

<button onclick="login()">LOGIN</button>
<button class="ghost" onclick="forgot()">Forgot Password?</button>
<button class="link" onclick="showRegister()">Create new account</button>
</div>

<div id="authMsg" class="msg hidden"></div>
</section>


<!-- PASSENGER -->
<section id="app" class="hidden">

<div class="card">
<h2>Book a ride</h2>

<label>Pickup</label>
<input id="pickup" placeholder="Enter pickup location">
<button class="ghost" onclick="locationPick()">📍 Use my location</button>

<label>Destination</label>
<input id="destination" placeholder="Where are you going?">

<label>Vehicle</label>
<div class="vehicles">
<button id="bike" class="on" onclick="vehicle('Bike')">🏍 Bike</button>
<button id="car" onclick="vehicle('Car')">🚗 Car</button>
<button id="tuk" onclick="vehicle('Tuk Tuk')">🛺 Tuk Tuk</button>
</div>

<label>Distance (km)</label>
<input id="distance" type="number" min="1" value="5" oninput="fare()">

<div class="small">Estimated fare</div>
<div class="fare" id="fareText">Rs. 95</div>

<label>Payment</label>
<select id="payment">
<option value="cash">Cash</option>
<option value="online">Online payment</option>
</select>

<button onclick="requestRide()">REQUEST RIDE</button>
<button class="danger hidden" id="cancelBtn" onclick="cancelRide()">CANCEL RIDE</button>

<div id="rideMsg" class="msg hidden"></div>
</div>


<div class="card">
<h2>Current ride</h2>
<div id="current">No active ride.</div>
</div>


<div class="card">
<button class="danger" onclick="sos()">🚨 SOS</button>
<button class="ghost" onclick="logout()">LOG OUT</button>
</div>

</section>
</div>

<script>
const URL="https://pdfgqlvovmyzhdnumypq.supabase.co";
const KEY="sb_publishable_cZnuDJwbDbtF2dDJ_M6rCg_-e-nWdMX";
const db=supabase.createClient(URL,KEY);

let user=null,vehicleType="Bike",settings={
 Bike:{base:25,km:14,min:25},
 Car:{base:60,km:25,min:60},
 "Tuk Tuk":{base:45,km:18,min:45}
};

const $=id=>document.getElementById(id);

function msg(t){
 $("authMsg").textContent=t;
 $("authMsg").classList.remove("hidden");
}

function showLogin(){
 $("registerBox").classList.add("hidden");
 $("loginBox").classList.remove("hidden");
 $("authTitle").textContent="Welcome back";
 $("authMsg").classList.add("hidden");
}

function showRegister(){
 $("loginBox").classList.add("hidden");
 $("registerBox").classList.remove("hidden");
 $("authTitle").textContent="Create account";
 $("authMsg").classList.add("hidden");
}

async function register(){
 let name=$("name").value.trim(),phone=$("phone").value.trim(),
 email=$("email").value.trim(),pass=$("password").value;

 if(!name||!phone||!email||pass.length<6)
  return msg("Please fill all fields. Password must be at least 6 characters.");

 let r=await db.auth.signUp({
  email:email,password:pass,
  options:{
   emailRedirectTo:"https://jemny2121217-rgb.github.io/Rydo/",
   data:{full_name:name,phone:phone,role:"passenger"}
  }
 });

 if(r.error)return msg(r.error.message);

 if(r.data.session){
  user=r.data.user;
  await saveProfile(name,phone);
  openApp();
 }else{
  msg("Account created. Check your email, then come back and LOGIN.");
  showLogin();
 }
}

async function login(){
 let email=$("loginEmail").value.trim(),pass=$("loginPassword").value;
 if(!email||!pass)return msg("Enter your email and password.");

 let r=await db.auth.signInWithPassword({email,password:pass});
 if(r.error)return msg(r.error.message);

 user=r.data.user;
 openApp();
}

async function forgot(){
 let email=$("loginEmail").value.trim();
 if(!email)return msg("Enter your email first.");

 let r=await db.auth.resetPasswordForEmail(email,{
  redirectTo:"https://jemny2121217-rgb.github.io/Rydo/"
 });

 if(r.error)return msg(r.error.message);
 msg("Password reset email sent. Check your inbox and Spam folder.");
}

async function saveProfile(name,phone){
 if(!user)return;
 await db.from("profiles").upsert({
  id:user.id,full_name:name,phone:phone,role:"passenger"
 });
}

function openApp(){
 $("auth").classList.add("hidden");
 $("app").classList.remove("hidden");
 loadSettings();
 loadRide();
}

function logout(){
 db.auth.signOut();
 user=null;
 $("app").classList.add("hidden");
 $("auth").classList.remove("hidden");
 showLogin();
}

function vehicle(v){
 vehicleType=v;
 ["bike","car","tuk"].forEach(x=>$(x).classList.remove("on"));
 if(v==="Bike")$("bike").classList.add("on");
 if(v==="Car")$("car").classList.add("on");
 if(v==="Tuk Tuk")$("tuk").classList.add("on");
 fare();
}

function fare(){
 let s=settings[vehicleType],d=Number($("distance").value)||0;
 let f=Math.max(s.min,s.base+d*s.km);
 $("fareText").textContent="Rs. "+Math.round(f);
}

async function loadSettings(){
 let r=await db.from("fare_settings")
  .select("vehicle_type,base_fare,per_km,minimum_fare");

 if(!r.error&&r.data.length){
  r.data.forEach(x=>{
   settings[x.vehicle_type]={
    base:Number(x.base_fare),
    km:Number(x.per_km),
    min:Number(x.minimum_fare)
   };
  });
 }
 fare();
}

async function requestRide(){
 if(!user)return;

 let pickup=$("pickup").value.trim(),
 dest=$("destination").value.trim(),
 distance=Number($("distance").value)||0,
 s=settings[vehicleType],
 f=Math.max(s.min,s.base+distance*s.km);

 if(!pickup||!dest||distance<=0){
  $("rideMsg").textContent="Enter pickup, destination and distance.";
  $("rideMsg").classList.remove("hidden");
  return;
 }

 let r=await db.from("rides").insert({
  passenger_id:user.id,
  pickup_location:pickup,
  destination:dest,
  vehicle_type:vehicleType,
  distance_km:distance,
  fare:Math.round(f),
  status:"requested",
  driver_earnings:0,
  admin_earnings:0
 }).select().single();

 if(r.error){
  $("rideMsg").textContent=r.error.message;
  $("rideMsg").classList.remove("hidden");
  return;
 }

 $("cancelBtn").classList.remove("hidden");
 $("rideMsg").textContent="Ride requested. Waiting for a driver.";
 $("rideMsg").classList.remove("hidden");
 showRide(r.data);
}

async function loadRide(){
 let r=await db.from("rides")
  .select("*")
  .eq("passenger_id",user.id)
  .in("status",["requested","accepted","arrived","started"])
  .order("created_at",{ascending:false})
  .limit(1);

 if(!r.error&&r.data.length)showRide(r.data[0]);
}

function showRide(r){
 $("current").innerHTML=
 "<b>Ride status:</b> "+r.status+
 "<br>Vehicle: "+r.vehicle_type+
 "<br>Fare: Rs. "+Math.round(r.fare)+
 "<br><span class='small'>"+r.pickup_location+" → "+r.destination+"</span>";

 if(["requested","accepted","arrived","started"].includes(r.status))
  $("cancelBtn").classList.remove("hidden");
 else $("cancelBtn").classList.add("hidden");
}

async function cancelRide(){
 let r=await db.from("rides").select("id")
  .eq("passenger_id",user.id)
  .in("status",["requested","accepted","arrived","started"])
  .order("created_at",{ascending:false})
  .limit(1).single();

 if(r.error)return;

 await db.from("rides").update({
  status:"cancelled",
  cancelled_at:new Date().toISOString(),
  cancellation_reason:"Cancelled by passenger"
 }).eq("id",r.data.id);

 $("cancelBtn").classList.add("hidden");
 $("current").textContent="Ride cancelled.";
}

function locationPick(){
 if(!navigator.geolocation)
  return alert("Location is not supported on this phone.");

 navigator.geolocation.getCurrentPosition(
 p=>$("pickup").value=p.coords.latitude.toFixed(6)+", "+p.coords.longitude.toFixed(6),
 ()=>alert("Could not get your location. Enter pickup manually.")
 );
}

function sos(){
 alert("SOS activated. For a real emergency, call Nepal Police: 100.");
}

db.auth.getSession().then(({data})=>{
 if(data.session){
  user=data.session.user;
  openApp();
 }
});
</script>
</body>
</html>
