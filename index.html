<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rydo Register Test</title>
<style>
body{background:#0b0d10;color:white;font-family:Arial;padding:25px}
.box{max-width:400px;margin:auto;background:#171a20;padding:20px;border-radius:18px}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;box-sizing:border-box}
input{background:#0d1014;color:white;border:1px solid #333}
button{background:white;color:#111;border:0;font-weight:bold}
#msg{margin-top:15px;color:#aaa}
</style>
</head><body><div class="box"><h1>Rydo</h1>
<h2>Create Account</h2><form id="registerForm"><input id="name" placeholder="Full name" required><input id="phone" placeholder="Phone number" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button type="button" id="show">Show password</button>

<button type="submit">REGISTER</button>

</form><div id="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>

const SUPABASE_URL =
"https://pdfgqlvovmyzhdnumypq.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cZnuDJwbDbtF2dDJ_M6rCg_-e-nWdMX";

const db =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const form =
document.getElementById("registerForm");

const msg =
document.getElementById("msg");

document.getElementById("show").onclick=function(){

const p=document.getElementById("password");

if(p.type==="password"){

p.type="text";
this.textContent="Hide password";

}else{

p.type="password";
this.textContent="Show password";

}

};

form.addEventListener("submit",async function(e){

e.preventDefault();

msg.textContent="Register button is working...";

const name=
document.getElementById("name").value.trim();

const phone=
document.getElementById("phone").value.trim();

const email=
document.getElementById("email").value.trim();

const password=
document.getElementById("password").value;

if(!name||!phone||!email||!password){

msg.textContent="Please fill every field.";

return;

}

try{

const result=await db.auth.signUp({

email:email,

password:password,

options:{

data:{

full_name:name,

phone:phone

}

}

});

if(result.error){

msg.textContent=result.error.message;

console.log(result.error);

return;

}

if(result.data.session){

msg.textContent="Registration successful!";

}else{

msg.textContent=
"Account created. Check your email to confirm your account.";

}

}catch(error){

msg.textContent=
"Error: "+error.message;

console.error(error);

}

});

</script></body>
  </html>
