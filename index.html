  <script>
    function requestRide() {
      document.getElementById("message").textContent =
        "Ride requested successfully!";

      localStorage.setItem("rydoRideRequested", "yes");
    }

    function viewRideRequests() {
      const requested = localStorage.getItem("rydoRideRequested");

      if (requested === "yes") {
        alert("🚗 New Rydo ride request!");
      } else {
        alert("No ride requests yet.");
      }
    }
  </script>
