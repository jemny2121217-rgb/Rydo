<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rydo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:480px;margin:auto;padding:18px}.logo{font-size:32px;font-weight:800;margin:12px 0}.sub{color:#999;margin-bottom:20px}
.card{background:#15181d;border:1px solid #252a31;border-radius:18px;padding:18px;margin:12px 0}
input,select{width:100%;padding:14px;margin:7px 0;background:#0e1115;border:1px solid #303640;border-radius:11px;color:white;font-size:15px}
button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:11px;background:#fff;color:#111;font-weight:700;font-size:15px}
button:active{transform:scale(.98)}.tabs{display:flex;gap:8px}.tabs button{background:#242931;color:#aaa}.tabs .on{background:#fff;color:#111}
.link{background:none;color:#fff;text-decoration:underline;padding:5px}.hide{display:none}.msg{color:#aaa;font-size:14px;margin:8px 0}
.vehicle{display:flex;gap:8px}.vehicle button{background:#242931;color:#aaa}.vehicle .sel{background:#fff;color:#111}
h2{margin-top:4px}
</style>
</head><body>
<div class="wrap">
<div class="logo">Rydo</div>
<div class="sub">Move your way.</div><div id="auth" class="card">
<div class="tabs">
<button id="loginTab" class="on" type="button">Login</button>
<button id="regTab" type="button">Register</button>
</div><form id="loginForm">
<input id="loginEmail" type="email" placeholder="Email" required>
<input id="loginPass" type="password" placeholder="Password" required>
<button type="submit">Login</button>
<button id="forgot" class="link" type="button">Forgot Password?</button>
</form><form id="regForm" class="hide">
<input id="regName" placeholder="Full name" required>
<input id="regPhone" placeholder="Phone number" required>
<input id="regEmail" type="email" placeholder="Email" required>
<input id="regPass" type="password" placeholder="Password" required>
<button id="showPass" class="link" type="button">Show password</button>
<button type="submit">Create Account</button>
</form>
<div id="authMsg" class="msg"></div>
</div><div id="app" class="hide">
<div class="card">
<h2>Book a ride</h2>
<input id="pickup" placeholder="Pickup location">
<button id="gps" type="button">📍 Use my location</button>
<input id="destination" placeholder="Destination">
<div class="vehicle">
<button data-v="bike" class="sel" type="button">🏍 Bike</button>
<button data-v="car" type="button">🚗 Car</button>
<button data-v="tuk" type="button">🛺 Tuk Tuk</button>
</div>
<button id="route" type="button">Calculate fare</button>
<div id="fare" class="msg">Distance: — | Fare: —</div>
<select id="payment">
<option value="cash">Cash</option>
<option value="online">Online payment</option>
</select>
<button id="request" type="button">Request Ride</button>
<button id="cancel" type="button">Cancel Ride</button>
</div><div class="card">
<div id="status">No active ride</div>
<button id="track" type="button">Track Driver</button>
<button id="sos" type="button">🚨 SOS</button>
<button id="logout" type="button">Logout</button>
</div>
</div>
</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://pdfgqlvovmyzhdnumypq.supabase.co";
const KEY="sb_publishable_cZnuDJwbDbtF2dDJ_M6rCg_-e-nWdMX";
const db=supabase.createClient(URL,KEY);
const $=id=>document.getElementById(id);
let vehicle="bike",distance=0,ride=null;

function msg(x){$("authMsg").textContent=x}

$("loginTab").onclick=()=>{
 $("loginTab").classList.add("on");$("regTab").classList.remove("on");
 $("loginForm").classList.remove("hide");$("regForm").classList.add("hide");msg("");
};

$("regTab").onclick=()=>{
 $("regTab").classList.add("on");$("loginTab").classList.remove("on");
 $("regForm").classList.remove("hide");$("loginForm").classList.add("hide");msg("");
};

$("showPass").onclick=()=>{
 $("regPass").type=$("regPass").type==="password"?"text":"password";
 $("showPass").textContent=$("regPass").type==="password"?"Show password":"Hide password";
};

$("regForm").onsubmit=async e=>{
 e.preventDefault();
 msg("Creating account...");
 const {data,error}=await db.auth.signUp({
  email:$("regEmail").value.trim(),
  password:$("regPass").value,
  options:{data:{
   full_name:$("regName").value.trim(),
   phone:$("regPhone").value.trim()
  }}
 });
 if(error){msg(error.message);return}
 if(data.session){
  await start();
 }else{
  msg("Account created. Check your email, confirm it, then login.");
 }
};

$("loginForm").onsubmit=async e=>{
 e.preventDefault();msg("Logging in...");
 const {error}=await db.auth.signInWithPassword({
  email:$("loginEmail").value.trim(),password:$("loginPass").value
 });
 if(error){msg(error.message);return}
 await start();
};

$("forgot").onclick=async()=>{
 const email=$("loginEmail").value.trim();
 if(!email){msg("Enter your email first.");return}
 const {error}=await db.auth.resetPasswordForEmail(email,{
  redirectTo:location.href
 });
 msg(error?error.message:"Password reset email sent.");
};

async function start(){
 const {data:{user}}=await db.auth.getUser();
 if(!user)return;
 $("auth").classList.add("hide");
 $("app").classList.remove("hide");
}

document.querySelectorAll("[data-v]").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll("[data-v]").forEach(x=>x.classList.remove("sel"));
  b.classList.add("sel");vehicle=b.dataset.v;
 };
});

$("gps").onclick=()=>{
 if(!navigator.geolocation)return alert("Location is not supported.");
 navigator.geolocation.getCurrentPosition(async p=>{
  const lat=p.coords.latitude,lon=p.coords.longitude;
  $("pickup").value=lat+","+lon;
 },()=>alert("Could not get your location."));
};

async function getPoint(q){
 const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q));
 const a=await r.json();
 if(!a[0])throw Error("Location not found: "+q);
 return [a[0].lon,a[0].lat];
}

$("route").onclick=async()=>{
 const a=$("pickup").value.trim(),b=$("destination").value.trim();
 if(!a||!b)return alert("Enter pickup and destination.");
 $("fare").textContent="Calculating...";
 try{
  const A=a.includes(",")?a.split(",").reverse().map(Number):await getPoint(a);
  const B=await getPoint(b);
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${A[0]},${A[1]};${B[0]},${B[1]}?overview=false`);
  const j=await r.json();
  distance=+(j.routes[0].distance/1000).toFixed(2);
  const rules={bike:[25,14],car:[60,25],tuk:[45,18]};
  const x=rules[vehicle],fare=Math.ceil(x[0]+distance*x[1]);
  $("fare").textContent=`Distance: ${distance} km | Fare: NPR ${fare}`;
 }catch(e){$("fare").textContent=e.message}
};

$("request").onclick=async()=>{
 if(!distance)return alert("Calculate fare first.");
 const {data:{user}}=await db.auth.getUser();
 if(!user)return alert("Please login.");
 const rules={bike:[25,14],car:[60,25],tuk:[45,18]};
 const fare=Math.ceil(rules[vehicle][0]+distance*rules[vehicle][1]);
 const {data,error}=await db.from("rides").insert({
  passenger_id:user.id,
  pickup_location:$("pickup").value,
  destination:$("destination").value,
  vehicle_type:vehicle,
  distance_km:distance,
  fare:fare,
  status:"requested"
 }).select().single();
 if(error){alert(error.message);return}
 ride=data;$("status").textContent="Ride requested. Waiting for driver...";
};

$("cancel").onclick=async()=>{
 if(!ride)return alert("No active ride.");
 const {error}=await db.from("rides").update({status:"cancelled"}).eq("id",ride.id);
 if(error){alert(error.message);return}
 ride=null;$("status").textContent="Ride cancelled.";
};

$("track").onclick=()=>alert(ride?"Driver tracking will appear after a driver accepts your ride.":"No active ride.");

$("sos").onclick=()=>location.href="tel:100";

$("logout").onclick=async()=>{
 await db.auth.signOut();location.reload();
};

db.auth.getSession().then(async({data})=>{
 if(data.session)await start();
});
</script></body>
</html>
