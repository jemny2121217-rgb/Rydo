<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rydo Driver</title>

  <link rel="stylesheet" href="css/driver.css">
</head>

<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="driver-header">

    <div>
      <div class="brand">Rydo</div>
      <div class="brand-subtitle">Driver</div>
    </div>

    <button
      id="logoutBtn"
      class="small-button"
      type="button"
    >
      Logout
    </button>

  </header>


  <!-- =====================================================
       LOGIN / REGISTRATION
       ===================================================== -->

  <main id="driverAuth" class="auth-container">

    <section class="auth-card">

      <div class="auth-title">
        <h1>Driver Portal</h1>
        <p>Drive with Rydo</p>
      </div>


      <!-- LOGIN -->

      <div id="driverLoginSection">

        <h2>Login</h2>

        <label for="driverLoginEmail">
          Email
        </label>

        <input
          id="driverLoginEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
        >


        <label for="driverLoginPassword">
          Password
        </label>

        <div class="password-box">

          <input
            id="driverLoginPassword"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
          >

          <button
            id="driverPasswordToggle"
            type="button"
            class="password-toggle"
          >
            Show
          </button>

        </div>


        <button
          id="driverLoginBtn"
          class="primary-button"
          type="button"
        >
          Login
        </button>


        <button
          id="showDriverRegisterBtn"
          class="secondary-button"
          type="button"
        >
          Create Driver Account
        </button>

      </div>


      <!-- REGISTRATION -->

      <div
        id="driverRegisterSection"
        class="hidden"
      >

        <h2>Create Driver Account</h2>


        <label for="driverName">
          Full Name
        </label>

        <input
          id="driverName"
          type="text"
          placeholder="Your full name"
          autocomplete="name"
        >


        <label for="driverPhone">
          Phone
        </label>

        <input
          id="driverPhone"
          type="tel"
          placeholder="98XXXXXXXX"
          autocomplete="tel"
        >


        <label for="driverRegisterEmail">
          Email
        </label>

        <input
          id="driverRegisterEmail"
          type="email"
          placeholder="Your email"
          autocomplete="email"
        >


        <label for="driverRegisterPassword">
          Password
        </label>

        <div class="password-box">

          <input
            id="driverRegisterPassword"
            type="password"
            placeholder="Minimum 6 characters"
            autocomplete="new-password"
          >

          <button
            id="driverRegisterPasswordToggle"
            type="button"
            class="password-toggle"
          >
            Show
          </button>

        </div>


        <label for="driverLicense">
          Driver License Number
        </label>

        <input
          id="driverLicense"
          type="text"
          placeholder="License number"
        >


        <h3>Vehicle Information</h3>


        <label for="vehicleType">
          Vehicle Type
        </label>

        <select id="vehicleType">

          <option value="Bike">
            Bike
          </option>

          <option value="Car">
            Car
          </option>

          <option value="Tuk Tuk">
            Tuk Tuk
          </option>

        </select>


        <label for="vehicleNumber">
          Vehicle Number
        </label>

        <input
          id="vehicleNumber"
          type="text"
          placeholder="Vehicle number"
        >


        <label for="vehicleModel">
          Vehicle Model
        </label>

        <input
